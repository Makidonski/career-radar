version: "3.9"

x-django-env: &django-env
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
    REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-career_radar}
      POSTGRES_USER: ${POSTGRES_USER:-career_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-career_radar}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-career_radar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  django:
    build:
      context: .
      dockerfile: django_app/Dockerfile
    restart: unless-stopped
    <<: *django-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - ./django_app:/app/django_app
      - static_data:/app/django_app/staticfiles
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost',8000),2)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  celery_worker:
    build:
      context: .
      dockerfile: django_app/Dockerfile
    restart: unless-stopped
    <<: *django-env
    depends_on:
      django:
        condition: service_healthy
    command: celery -A config worker --loglevel=info
    volumes:
      - ./django_app:/app/django_app

  celery_beat:
    build:
      context: .
      dockerfile: django_app/Dockerfile
    restart: unless-stopped
    <<: *django-env
    depends_on:
      django:
        condition: service_healthy
    command: celery -A config beat --loglevel=info
    volumes:
      - ./django_app:/app/django_app

  fastapi:
    build:
      context: .
      dockerfile: fastapi_service/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"

  telegram_bot:
    build:
      context: .
      dockerfile: telegram_bot/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      - django
      - fastapi

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - django
      - fastapi
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./telegram_miniapp:/usr/share/nginx/miniapp:ro
      - static_data:/usr/share/nginx/static:ro

volumes:
  postgres_data:
  static_data: